const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.value = 0.15;
    if (type === 'correct') {
      o.type = 'sine'; o.frequency.setValueAtTime(523, audioCtx.currentTime);
      o.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
      o.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
      o.start(); o.stop(audioCtx.currentTime + 0.5);
    } else if (type === 'wrong') {
      o.type = 'sawtooth'; o.frequency.setValueAtTime(200, audioCtx.currentTime);
      o.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'click') {
      o.type = 'sine'; o.frequency.value = 800;
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      o.start(); o.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'win') {
      [523,659,784,1047].forEach((f,i) => {
        const oo = audioCtx.createOscillator(); const gg = audioCtx.createGain();
        oo.connect(gg); gg.connect(audioCtx.destination);
        oo.type = 'sine'; oo.frequency.value = f; gg.gain.value = 0.12;
        gg.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3*(i+1) + 0.4);
        oo.start(audioCtx.currentTime + 0.3*i); oo.stop(audioCtx.currentTime + 0.3*(i+1) + 0.4);
      });
    }
  } catch(e) {}
}

// Hàm xáo trộn mảng
function shuffleArray(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

// Hàm xáo trộn đáp án cho câu trắc nghiệm
function shuffleOptions(question) {
  const q = {...question};
  if (q.type === 'mcq') {
    const optionsWithIndex = q.opts.map((opt, idx) => ({opt, idx}));
    const shuffled = shuffleArray(optionsWithIndex);
    q.opts = shuffled.map(item => item.opt);
    // Cập nhật chỉ số câu đúng
    q.ans = shuffled.findIndex(item => item.idx === question.ans);
  }
  return q;
}

// Chọn 25 câu ngẫu nhiên từ ngân hàng và xáo trộn đáp án
function getRandomQuestions() {
  const shuffled = shuffleArray(questionBank);
  const selected = shuffled.slice(0, 25);
  return selected.map(q => shuffleOptions(q));
}

        <div class="absolute text-5xl float" style="bottom:12%;right:8%;animation-delay:1.5s">🚲</div>
        <div class="absolute text-4xl float" style="top:40%;left:3%;animation-delay:0.7s">⏱️</div>
        <div class="absolute text-4xl float" style="top:35%;right:5%;animation-delay:1.2s">📏</div>
        <div class="absolute text-5xl float" style="bottom:35%;right:15%;animation-delay:0.3s">🏎️</div>
      </div>
      <div class="relative z-10 text-center slide-up">
        <div class="text-7xl mb-4">🚀</div>
        <h1 id="homeTitle" class="text-white font-extrabold mb-3 drop-shadow-lg" style="font-size:${bs*2.5}px">${c.game_title}</h1>
        <p class="text-white/90 mb-8 max-w-md mx-auto" style="font-size:${bs}px">Cùng khám phá thế giới vận tốc, quãng đường và thời gian nhé! 🌟 25 câu hỏi thú vị đang chờ bạn!</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
          <button onclick="startGame()" class="btn-bounce px-8 py-4 rounded-2xl font-bold text-xl shadow-xl hover:shadow-2xl transition-all pulse-anim" style="background:${c.primary_action_color};color:#fff;font-size:${bs*1.3}px">
            🎮 ${c.start_button_text}
          </button>
          <button onclick="showHow()" class="btn-bounce px-8 py-4 rounded-2xl font-bold text-xl shadow-xl hover:shadow-2xl transition-all" style="background:${c.secondary_action_color};color:#fff;font-size:${bs*1.1}px">
            📖 Cách Chơi
          </button>

  } else if (screen === 'how') {
    app.innerHTML = `
    <div class="w-full h-full bg-pattern flex items-center justify-center p-4 overflow-auto" style="font-family:${ff}">
      <div class="rounded-3xl shadow-2xl p-8 max-w-lg w-full slide-up" style="background:${c.surface_color};color:${c.text_color}">
        <h2 class="font-bold text-center mb-6" style="font-size:${bs*1.8}px">📖 Cách Chơi</h2>
        <div class="space-y-4" style="font-size:${bs}px">
          <div class="flex gap-3 items-start"><span class="text-2xl">🎯</span><p><b>Trắc nghiệm:</b> Chọn 1 đáp án đúng trong 4 phương án.</p></div>
          <div class="flex gap-3 items-start"><span class="text-2xl">📦</span><p><b>Phân loại:</b> Kéo thả các mục vào đúng nhóm, rồi nhấn "Kiểm tra".</p></div>
          <div class="flex gap-3 items-start"><span class="text-2xl">⭐</span><p><b>Điểm số:</b> Tổng 10 điểm cho 25 câu. Mỗi câu đúng được 0.4 điểm.</p></div>
          <div class="flex gap-3 items-start"><span class="text-2xl">🏆</span><p><b>Mục tiêu:</b> Trả lời đúng càng nhiều càng tốt!</p></div>
          <div class="flex gap-3 items-start"><span class="text-2xl">🔊</span><p><b>Âm thanh:</b> Có hiệu ứng âm thanh khi trả lời đúng/sai.</p></div>
        </div>
        <div class="text-center mt-6">
          <button onclick="goHome()" class="btn-bounce px-6 py-3 rounded-2xl font-bold text-white shadow-lg" style="background:${c.secondary_action_color};font-size:${bs*1.1}px">⬅️ Quay lại</button>
        </div>
      </div>
    </div>`;
  } else if (screen === 'game') {
    renderGame(c, ff, bs);
  } else if (screen === 'result') {
    renderResult(c, ff, bs);
  }
  lucide.createIcons();
}

function renderGame(c, ff, bs) {
  const app = document.getElementById('app');
  const q = questions[currentQ];
  const progress = ((currentQ) / questions.length) * 100;
  const isAnswered = answered[currentQ] !== undefined;

  let qContent = '';
  if (q.type === 'mcq') {
    qContent = q.opts.map((o, i) => {
      let cls = `w-full text-left px-5 py-4 rounded-2xl font-semibold transition-all border-2 `;
      let extra = '';
      if (isAnswered) {
        if (i === q.ans) cls += 'border-green-400 bg-green-50 text-green-800';
        else if (i === answered[currentQ] && i !== q.ans) cls += 'border-red-400 bg-red-50 text-red-800 shake';
        else cls += 'border-gray-200 bg-gray-50 text-gray-400 opacity-60';
        extra = 'pointer-events-none';
      } else {
        cls += `border-gray-200 hover:border-amber-400 hover:shadow-md cursor-pointer`;
        extra = `onclick="answerMCQ(${i})"`;
      }
      const icon = isAnswered ? (i === q.ans ? '✅' : (i === answered[currentQ] ? '❌' : '⚪')) : ['🅰️','🅱️','©️','🅳'][i] || '⭕';
      return `<button class="${cls} btn-bounce" style="font-size:${bs}px;font-family:${ff}" ${extra}>${icon} ${o}</button>`;
    }).join('');
  } else {
    // Classify
    const placed = answered[currentQ]?.placed || {};
    const checked = answered[currentQ]?.checked || false;
    const remainingItems = q.items.filter(it => !Object.values(placed).flat().includes(it));

    let itemsHtml = checked ? '' : `<div class="flex flex-wrap gap-2 mb-4 min-h-[40px] justify-center" id="itemPool">
      ${remainingItems.map(it => `<div class="category-drag px-3 py-2 rounded-xl font-semibold text-sm shadow" style="background:${c.primary_action_color};color:#fff;font-size:${bs*0.85}px" draggable="true" ondragstart="dragStart(event,'${encodeURIComponent(it)}')" onclick="tapItem(this,'${encodeURIComponent(it)}')">${it}</div>`).join('')}
    </div>`;

    let catsHtml = q.categories.map(cat => {
      const catItems = placed[cat] || [];
      let borderColor = '#e5e7eb';
      if (checked) {
        const allCorrect = catItems.every(it => q.correctMap[it] === cat) && catItems.length > 0;
        borderColor = allCorrect ? '#22c55e' : '#ef4444';
      }
      return `<div class="rounded-2xl border-2 p-3 mb-3 drop-zone" style="border-color:${borderColor};background:${c.surface_color}20"
        ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')"
        ondrop="dropItem(event,this,'${encodeURIComponent(cat)}')">
        <div class="font-bold text-sm mb-2" style="color:${c.secondary_action_color};font-size:${bs*0.85}px">${cat}</div>
        <div class="flex flex-wrap gap-1 min-h-[32px]" id="cat_${encodeURIComponent(cat)}">
          ${catItems.map(it => {
            let itColor = c.primary_action_color;
            if (checked) itColor = q.correctMap[it] === cat ? '#22c55e' : '#ef4444';
            return `<div class="px-2 py-1 rounded-lg text-white text-xs font-semibold ${checked?'':'cursor-pointer'}" style="background:${itColor};font-size:${bs*0.75}px" ${checked?'':`onclick="removeFromCat('${encodeURIComponent(it)}','${encodeURIComponent(cat)}')"`}>${it} ${checked?(q.correctMap[it]===cat?'✅':'❌'):''}</div>`;
          }).join('')}
        </div>
      </div>`;
    }).join('');

    let checkBtn = '';
    if (!checked && remainingItems.length === 0) {
      checkBtn = `<button onclick="checkClassify()" class="btn-bounce w-full py-3 rounded-2xl font-bold text-white shadow-lg mt-2" style="background:${c.primary_action_color};font-size:${bs}px">✅ Kiểm tra</button>`;
    }
    if (checked) {
      const allCorrect = q.items.every(it => placed[q.correctMap[it]]?.includes(it));
      checkBtn = `<div class="text-center py-2 font-bold ${allCorrect?'text-green-600':'text-red-500'}" style="font-size:${bs}px">${allCorrect?'🎉 Chính xác!':'😅 Chưa đúng hết rồi!'}</div>`;
    }

    qContent = itemsHtml + catsHtml + checkBtn;
  }

  const nextDisabled = !isAnswered && !(answered[currentQ]?.checked);
  app.innerHTML = `
  <div class="w-full h-full bg-game flex flex-col p-3 overflow-auto" style="font-family:${ff}">
    <div class="flex items-center justify-between mb-2 gap-2">
      <button onclick="goHome()" class="btn-bounce text-white/80 hover:text-white p-2"><i data-lucide="home" style="width:24px;height:24px"></i></button>
      <div class="flex-1 bg-white/30 rounded-full h-4 overflow-hidden">
        <div class="progress-bar h-full rounded-full" style="width:${progress}%;background:${c.primary_action_color}"></div>
      </div>
      <div class="text-white font-bold whitespace-nowrap" style="font-size:${bs*0.85}px">⭐ ${(score*0.4).toFixed(1)}/10</div>
    </div>
    <div class="text-white/80 text-center mb-2" style="font-size:${bs*0.8}px">Câu ${currentQ+1}/${questions.length} · ${q.level}</div>
    <div class="flex-1 flex items-start justify-center">
      <div class="rounded-3xl shadow-2xl p-5 w-full max-w-lg slide-up" style="background:${c.surface_color};color:${c.text_color}">
        <h3 class="font-bold mb-4 leading-relaxed" style="font-size:${bs*1.15}px">${q.q}</h3>
        <div class="space-y-3">${qContent}</div>
        ${(isAnswered || answered[currentQ]?.checked) ? `
        <button onclick="nextQ()" class="btn-bounce w-full mt-4 py-3 rounded-2xl font-bold text-white shadow-lg" style="background:${c.secondary_action_color};font-size:${bs}px">
          ${currentQ < questions.length - 1 ? 'Câu tiếp theo ➡️' : 'Xem kết quả 🏆'}
        </button>` : ''}
      </div>
    </div>
  </div>`;
  lucide.createIcons();
}

function renderResult(c, ff, bs) {
  const app = document.getElementById('app');
  const finalScore = (score * 0.4).toFixed(1);
  let emoji, msg;
  if (finalScore >= 9) { emoji = '🏆'; msg = 'Xuất sắc! Bạn là thiên tài!'; }
  else if (finalScore >= 7) { emoji = '🌟'; msg = 'Giỏi lắm! Bạn rất tuyệt vời!'; }
  else if (finalScore >= 5) { emoji = '👍'; msg = 'Khá tốt! Cố gắng thêm nhé!'; }
  else { emoji = '💪'; msg = 'Hãy ôn lại và thử lại nhé!'; }

  app.innerHTML = `
  <div class="w-full h-full bg-result flex items-center justify-center p-4 overflow-auto" style="font-family:${ff}">
    <div id="confettiContainer" class="absolute inset-0 pointer-events-none overflow-hidden"></div>
    <div class="relative z-10 rounded-3xl shadow-2xl p-8 max-w-md w-full text-center pop" style="background:${c.surface_color};color:${c.text_color}">
      <div class="text-8xl mb-4">${emoji}</div>
      <h2 class="font-extrabold mb-2" style="font-size:${bs*2}px">Hoàn thành!</h2>
      <p class="mb-4" style="font-size:${bs*1.2}px">${msg}</p>
      <div class="rounded-2xl p-6 mb-6" style="background:${c.bg_color}20">
        <div class="font-extrabold" style="font-size:${bs*3}px;color:${c.primary_action_color}">${finalScore}/10</div>
        <p style="font-size:${bs*0.9}px">Đúng ${score}/${questions.length} câu</p>
      </div>
      <div class="flex gap-3 justify-center flex-wrap">
        <button onclick="startGame()" class="btn-bounce px-6 py-3 rounded-2xl font-bold text-white shadow-lg" style="background:${c.primary_action_color};font-size:${bs*1.1}px">🔄 Chơi lại</button>
        <button onclick="goHome()" class="btn-bounce px-6 py-3 rounded-2xl font-bold text-white shadow-lg" style="background:${c.secondary_action_color};font-size:${bs*1.1}px">🏠 Trang chủ</button>
      </div>
    </div>
  </div>`;

  // Confetti
  playSound('win');
  const container = document.getElementById('confettiContainer');
  const emojis = ['🎉','🎊','⭐','🌟','💫','🎈','🎆','✨'];
  for (let i = 0; i < 30; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.left = Math.random()*100+'%';
    el.style.bottom = '-20px';
    el.style.fontSize = (20+Math.random()*20)+'px';
    el.style.animationDelay = Math.random()*1+'s';
    el.style.animationDuration = (1+Math.random()*1.5)+'s';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    container.appendChild(el);
  }
}

// Game logic
let selectedItem = null;

window.startGame = function() {
  playSound('click');
  currentQ = 0; score = 0; answered = [];
  screen = 'game'; render();
};
window.goHome = function() { playSound('click'); screen = 'home'; render(); };
window.showHow = function() { playSound('click'); screen = 'how'; render(); };

window.answerMCQ = function(i) {
  const q = questions[currentQ];
  answered[currentQ] = i;
  if (i === q.ans) { score++; playSound('correct'); }
  else { playSound('wrong'); }
  render();
};

window.nextQ = function() {
  playSound('click');
  if (currentQ < questions.length - 1) { currentQ++; screen = 'game'; }
  else { screen = 'result'; }
  render();
};

// Classify drag/drop + tap
window.dragStart = function(e, item) {
  e.dataTransfer.setData('text', item);
};
window.dropItem = function(e, el, cat) {
  e.preventDefault();
  el.classList.remove('drag-over');
  const item = decodeURIComponent(e.dataTransfer.getData('text'));
  addToCat(item, decodeURIComponent(cat));
};
window.tapItem = function(el, encodedItem) {
  const item = decodeURIComponent(encodedItem);
  const q = questions[currentQ];
  // Add to first non-full category
  for (const cat of q.categories) {
    const placed = answered[currentQ]?.placed || {};
    const catItems = placed[cat] || [];
    addToCat(item, cat);
    return;
  }
};
window.removeFromCat = function(encodedItem, encodedCat) {
  const item = decodeURIComponent(encodedItem);
  const cat = decodeURIComponent(encodedCat);
  if (!answered[currentQ]) return;
  const placed = answered[currentQ].placed;
  if (placed[cat]) {
    placed[cat] = placed[cat].filter(i => i !== item);
  }
  render();
};

function addToCat(item, cat) {
  if (!answered[currentQ]) answered[currentQ] = { placed: {}, checked: false };
  const placed = answered[currentQ].placed;
  // Remove from other categories first
  for (const c of questions[currentQ].categories) {
    if (placed[c]) placed[c] = placed[c].filter(i => i !== item);
  }
  if (!placed[cat]) placed[cat] = [];
  if (!placed[cat].includes(item)) placed[cat].push(item);
  playSound('click');
  render();
}

window.checkClassify = function() {
  const q = questions[currentQ];
  const placed = answered[currentQ].placed;
  answered[currentQ].checked = true;
  const allCorrect = q.items.every(it => placed[q.correctMap[it]]?.includes(it));
  if (allCorrect) { score++; playSound('correct'); }
  else { playSound('wrong'); }
  render();
};

// Element SDK
window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => { render(); },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get:()=>config.bg_color||defaultConfig.bg_color, set:(v)=>{config.bg_color=v;window.elementSdk.setConfig({bg_color:v})} },
      { get:()=>config.surface_color||defaultConfig.surface_color, set:(v)=>{config.surface_color=v;window.elementSdk.setConfig({surface_color:v})} },
      { get:()=>config.text_color||defaultConfig.text_color, set:(v)=>{config.text_color=v;window.elementSdk.setConfig({text_color:v})} },
      { get:()=>config.primary_action_color||defaultConfig.primary_action_color, set:(v)=>{config.primary_action_color=v;window.elementSdk.setConfig({primary_action_color:v})} },
      { get:()=>config.secondary_action_color||defaultConfig.secondary_action_color, set:(v)=>{config.secondary_action_color=v;window.elementSdk.setConfig({secondary_action_color:v})} },
    ],
    borderables: [],
    fontEditable: { get:()=>config.font_family||defaultConfig.font_family, set:(v)=>{config.font_family=v;window.elementSdk.setConfig({font_family:v})} },
    fontSizeable: { get:()=>config.font_size||defaultConfig.font_size, set:(v)=>{config.font_size=v;window.elementSdk.setConfig({font_size:v})} },
  }),
  mapToEditPanelValues: (config) => new Map([
    ["game_title", config.game_title || defaultConfig.game_title],
    ["start_button_text", config.start_button_text || defaultConfig.start_button_text],
  ])
});

render();
